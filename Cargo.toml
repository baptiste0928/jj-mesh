[package]
name = "jj-mesh"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.4", features = ["derive", "wrap_help"] }
color-eyre = "0.6.5"
data-encoding = "2.11.0"
etcetera = "0.11.0"
gethostname = "1.0.2"
gix = { version = "0.85.0", default-features = false }
iroh = "1.0.3"
jj-lib = "=0.43.0" # Exact pin since jj's on-disk formats are internal and may change between releases
notify = "7.0.0"
pollster = "0.4.0"
postcard = { version = "1.1.3", features = ["use-std"] }
prost = "0.14.3" # Same version as jj-lib's, to decode its op store protos
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
service-manager = "0.11.0"
subtle = { version = "2.6.1", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.49.0", features = [
    "io-util",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.49.0", features = ["macros"] }
