name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.asset }})

    strategy:
      matrix:
        include:
          - asset: jj-mesh-Linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - asset: jj-mesh-Linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - asset: jj-mesh-Darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install musl
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        run: rustup toolchain install && rustup target add ${{ matrix.target }}

      - name: Build binary
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          # cc only finds musl-gcc by itself on x86_64
          if [[ $TARGET == *-musl ]]; then export "CC_${TARGET//-/_}=musl-gcc"; fi
          cargo build --release --locked --target "$TARGET"
          mv "target/$TARGET/release/jj-mesh" "$ASSET"

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract release notes
        run: |
          version=${GITHUB_REF_NAME#v}
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [[ $cargo_version != "$version" ]]; then
            echo "::error::Cargo.toml version $cargo_version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          awk -v head="## [$version]" 'index($0, head) == 1 { f = 1; next } /^## \[|^\[.*\]: / { f = 0 } f' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jj-mesh-*
          path: dist
          merge-multiple: true

      - name: Attest binaries
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/jj-mesh-*

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*
