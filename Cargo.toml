[package]
name = "jj-mesh"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.4", features = ["derive", "wrap_help"] }
color-eyre = "0.6.5"
data-encoding = "2.11.0"
etcetera = "0.11.0"
gethostname = "1.0.2"
iroh = "1.0.3"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
subtle = { version = "2.6.1", default-features = false }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "time"] }
toml_edit = { version = "0.25.13", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"
