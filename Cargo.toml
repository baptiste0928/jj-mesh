[package]
name = "jj-mesh"
version = "0.1.1"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.6.9", features = ["unstable-dynamic"] }
color-eyre = "0.6.5"
console = "0.16.4"
data-encoding = "2.11.1"
etcetera = "0.11.0"
gethostname = "1.1.0"
gix = { version = "0.87.1", default-features = false }
gix-pack = "0.74.2"
indicatif = "0.18.6"
ignore = "0.4"
iroh = "1.1.0"
jj-lib = "0.45.1" # Exact pin since jj's on-disk formats are internal and may change between releases
mimalloc = "0.1.52"
notify = "8.2.0"
pollster = "1.0.1"
postcard = { version = "1.1.3", features = ["use-std"] }
prost = "0.14.4"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
service-manager = "0.11.0"
subtle = { version = "2.6.1", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-util", "net", "process", "rt", "signal", "sync", "time"] }
toml = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zstd = "0.13.3"

[features]
test-util = []

[dev-dependencies]
jj-mesh = { path = ".", features = ["test-util"] }
tokio = { version = "1.53.1", features = ["macros"] }
