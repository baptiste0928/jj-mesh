name: Release
on: workflow_dispatch

jobs:
  build:
    name: Build (${{ matrix.asset }})

    strategy:
      matrix:
        include:
          - asset: jj-mesh-Linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - asset: jj-mesh-Linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - asset: jj-mesh-Darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install musl
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        run: rustup toolchain install && rustup target add ${{ matrix.target }}

      - name: Build binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # cc only finds musl-gcc by itself on x86_64
          if [[ $TARGET == *-musl ]]; then export "CC_${TARGET//-/_}=musl-gcc"; fi
          cargo build --release --locked --target "$TARGET"
          mv "target/$TARGET/release/jj-mesh" .

      - name: Attest binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: jj-mesh

      - name: Package binary
        run: tar -czf "${{ matrix.asset }}.tar.gz" jj-mesh

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ matrix.asset }}.tar.gz
          archive: false
          if-no-files-found: error
