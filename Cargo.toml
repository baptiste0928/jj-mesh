[package]
name = "jj-mesh"
version = "0.2.0"
description = "Peer-to-peer synchronization daemon for jj repositories"
repository = "https://github.com/baptiste0928/jj-mesh"
edition = "2024"
license = "ISC"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
console = "0.16.6"
data-encoding = "2.11.1"
dialoguer = { version = "0.12.0", default-features = false }
etcetera = "0.11.0"
fail = "0.5.1"
futures = { version = "0.3.34", default-features = false, features = ["std"] }
gethostname = "1.1.0"
gix = { version = "0.88.0", default-features = false, features = ["sha1", "sha256"] }
gix-pack = "0.75.0"
indicatif = "0.18.6"
ignore = "0.4"
iroh = { version = "1.4.1", features = ["platform-verifier"] }
jiff = "0.2.38"
jj-lib = "0.46.0" # Exact pin since jj's on-disk formats are internal and may change between releases
mimalloc = "0.1.52"
notify = "8.2.0"
pollster = "1.0.1"
postcard = { version = "1.1.3", features = ["use-std"] }
prost = "0.14.4"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
subtle = { version = "2.6.1", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "net", "process", "rt", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zstd = "0.14.3"
shell-words = "1.1.1"

[target.'cfg(target_os = "macos")'.dependencies]
kqueue = "1.2.1"
libc = "0.2.191"

[features]
test-util = []
failpoints = ["fail/failpoints"]

[dev-dependencies]
fail = "0.5.1"
jj-mesh = { path = ".", features = ["test-util", "failpoints"] }
tokio = { version = "1.54.1", features = ["macros"] }
